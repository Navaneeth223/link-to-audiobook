      <main>
        <h1>Private Story Reader: read and listen to your documents</h1>
        <p>
          Private Story Reader is a free, open-source browser app for reading TXT, Markdown, PDF, DOCX and EPUB files
          and listening with voices available in your browser or operating system. Local Piper voices can create MP3
          or WAV audiobook exports. Local files are parsed in the browser, and generated audio remains in browser storage.
        </p>
        <h2>How it works</h2>
        <ol>
          <li>Choose a document from your device or provide a OneDrive or SharePoint link.</li>
          <li>Read the extracted text by chapter or listen with a browser or operating system voice.</li>
          <li>For audiobook export, choose a Piper voice and save chapter MP3 files in a ZIP, a chapter-marked MP3, or WAV.</li>
        </ol>
        <h2>Features</h2>
        <ul>
          <li>In-browser text extraction for TXT, Markdown, PDF, DOCX and EPUB files up to 40 MB.</li>
          <li>Chapter navigation, sentence highlighting, search, bookmarks and reading preferences.</li>
          <li>Local Piper audiobook export as MP3 or WAV; browser speech voices are for playback and cannot be exported.</li>
          <li>Optional OneDrive and SharePoint retrieval through a configured, delegated Microsoft Graph API.</li>
          <li>AGPL-3.0-or-later open-source license.</li>
        </ul>
        <h2>Frequently asked questions</h2>
        <h3>Are my files uploaded?</h3>
        <p>Files selected from the device are parsed in the browser. OneDrive and SharePoint links use the configured API and Microsoft Graph. Piper narration runs locally after voice assets are downloaded.</p>
        <h3>Which document formats are supported?</h3>
        <p>TXT, Markdown, PDF, DOCX and EPUB. Scanned PDFs need OCR, which is not included.</p>
        <h3>Is it free and open source?</h3>
        <p>Yes. Private Story Reader is free to use and licensed under AGPL-3.0-or-later.</p>
        <h3>Does it work offline?</h3>
        <p>It is not a packaged offline app. Previously downloaded Piper assets are stored locally, but first-time downloads and OneDrive or SharePoint retrieval need a network connection.</p>
        <h3>Which voices and export formats are available?</h3>
        <p>Playback uses voices supplied by the browser or operating system. Local Piper voices can export chapter MP3 files in a ZIP, a single chapter-marked MP3, or WAV.</p>
        <h3>Where can I find the source code?</h3>
        <p><a href="https://github.com/Navaneeth223/link-to-audiobook">Private Story Reader on GitHub</a></p>
      </main>
